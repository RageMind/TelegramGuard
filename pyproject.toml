[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qyai-telegramguard"
version = "0.6.0"
description = "Telegram-first control plane for private VPS administration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "QyAi" }]
keywords = ["telegram", "vps", "ssh", "nftables", "security", "server", "qyai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
  "Topic :: Security",
]
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.urls]
Homepage = "https://qyai.ru"
Repository = "https://github.com/RageMind/TelegramGuard"
Issues = "https://github.com/RageMind/TelegramGuard/issues"

[project.scripts]
telegram-guard = "telegram_guard.bot:main"
telegram-guard-helper = "telegram_guard.helper:main"
telegram-guard-doctor = "telegram_guard.doctor:main"
telegram-guard-config = "telegram_guard.config_cli:main"
telegram-guard-pam = "telegram_guard.pam_gate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S603"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"scripts/public_safety_scan.py" = ["S603"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
