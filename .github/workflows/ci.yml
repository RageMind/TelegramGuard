name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Public safety scan
        run: python scripts/public_safety_scan.py .

      - name: Shell syntax
        run: |
          bash -n             packaging/install.sh             packaging/uninstall.sh             packaging/enable-ssh-approval.sh             packaging/disable-ssh-approval.sh

      - name: Python compile
        run: python -m compileall -q src scripts tests

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src

      - name: Tests
        run: pytest -q

      - name: Package wheel smoke
        run: |
          python -m pip wheel . --no-deps --wheel-dir /tmp/telegramguard-wheel
          test -n "$(find /tmp/telegramguard-wheel -maxdepth 1 -name 'qyai_telegramguard-*.whl' -print -quit)"
